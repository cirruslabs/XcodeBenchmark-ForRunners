name: Benchmark

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  macos:
    name: "Run"
    strategy:
      fail-fast: false
      matrix:
        image: [ "runner:sequoia", "runner:sequoia-xl", "runner:sequoia-xxl"]
    runs-on: ["ghcr.io/cirruslabs/macos-${{ matrix.image }}", "low-priority"]
    steps:
      - uses: actions/checkout@v4
      - name: macOS version
        run: sw_vers
      - name: Xcodes list
        run: xcodes installed
      - name: Uptime
        run: uptime
      - name: List
        run: xcrun simctl list
      - name: Run benchmark
        run: sh benchmark.sh
